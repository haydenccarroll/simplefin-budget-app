# SimpleFIN Budget App: the whole stack.
#
#   cp .env.example .env
#   docker compose up -d --build
#
# The API is on http://localhost:8080.
name: simplefin-budget-app

x-api-env: &api-env
  DATABASE_PATH: /data/budget.db
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LLM_URL: http://ollama:11434
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}

services:
  # The self-hosted model that categorizes bank transactions. CPU only; nothing is
  # sent outside once the model has been downloaded (a one-time pull).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    # Start the server, make sure the model is present, then stay attached to the server.
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1 || ollama pull "$$OLLAMA_MODEL" || echo "model pull failed; expenses will be left uncategorized"
        wait
    environment:
      OLLAMA_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$$OLLAMA_MODEL\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 90

  # The API. It creates the SQLite database on the data volume (and applies any
  # migrations) when it starts.
  api:
    build:
      context: ./apps/budget-api
      # The web app, built into the image and served at http://localhost:8080.
      additional_contexts:
        webapp: ./apps/simplefin-budget-app
    image: budget-api:latest
    command: ["serve"]
    restart: unless-stopped
    environment:
      <<: *api-env
      SERVE_PORT: "8080"
      CATEGORIZATION_ENABLED: "true"
      # Web origins allowed to call the API from a browser (besides its own origin).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      # True when served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-720h}
    volumes:
      - data:/data
    ports:
      - "${API_PORT:-8080}:8080"

  # Takes categorization jobs off the jobs table and runs them against the
  # model. It shares the API's database file through the data volume.
  worker:
    image: budget-api:latest
    command: ["worker"]
    restart: unless-stopped
    environment: *api-env
    volumes:
      - data:/data
    depends_on:
      api:
        condition: service_started

volumes:
  data:
  ollama-models:
